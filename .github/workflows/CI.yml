name: CI
on:
  push:
    branches:
      - master
    tags: ['*']
  pull_request:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'min'     # minimum supported version
          - '1'       # latest stable 1.x version
          - 'nightly'
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        exclude:
          # macOS-latest uses Apple Silicon (ARM); older Julia versions (e.g. 1.6) don't support ARM.
          # Exclude 'min' from macOS-latest and run it on macos-13 (Intel) instead.
          # See: https://discourse.julialang.org/t/how-to-fix-github-actions-ci-failures-with-julia-1-6-or-1-7-on-macos-latest-and-macos-14/117019
          - version: 'min'
            os: macOS-latest
        include:
          # Run Julia min on macOS-13 (Intel) instead of macOS-latest (ARM)
          - version: 'min'
            os: macos-13
    steps:
      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v1
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v2
        with:
          files: lcov.info
